name: persian_calendar
description: A beautiful Persian (Jalali) calendar app for Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  http: ^1.2.1
  flutter_localizations:
    sdk: flutter
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
